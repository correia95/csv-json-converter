    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "CSV to JSON Converter",
        "url": "https://csv-json-converter.correia95.workers.dev/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Convert CSV to JSON and JSON to CSV in the browser, with RFC 4180 quoted-field parsing, custom delimiters, a header-row option and automatic type detection."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do I convert CSV to JSON?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Paste the CSV into the input box with \"CSV → JSON\" selected. With the header-row option on, the first line becomes the object keys and each following row becomes a JSON object; with it off you get an array of arrays."
            }
          },
          {
            "@type": "Question",
            "name": "How do I convert JSON to CSV?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Switch to \"JSON → CSV\" and paste an array of objects. The columns are the union of all keys, so objects missing a key get an empty cell. An array of arrays is written row by row and a single object becomes one row."
            }
          },
          {
            "@type": "Question",
            "name": "Does it handle commas and quotes inside fields?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Fields wrapped in double quotes may contain commas, line breaks and doubled quotes (\"\") per RFC 4180, and the converter quotes and escapes fields that need it when writing CSV."
            }
          },
          {
            "@type": "Question",
            "name": "Is my data sent to a server?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. The conversion runs entirely in your browser and the input is stored only in your browser's local storage. The page works offline once loaded."
            }
          }
        ]
      }
    </script>
  </head>
