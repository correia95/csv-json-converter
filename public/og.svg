<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0b0d0c" />
  <text x="90" y="140" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="80" font-weight="800" fill="#e7edea" letter-spacing="-1">CSV ⇄ JSON Converter</text>
  <text x="90" y="192" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="27" fill="#6bbf9f">Both directions · quoted fields · delimiters · header row · types</text>
  <text x="90" y="290" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#94a19c">name,age</text>
  <text x="90" y="326" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#94a19c">Ada,36</text>
  <text x="520" y="308" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="44" fill="#34d399">→</text>
  <text x="620" y="290" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#34d399">[{ "name": "Ada",</text>
  <text x="620" y="326" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#34d399">   "age": 36 }]</text>
  <text x="90" y="450" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="26" fill="#e7edea">RFC 4180 parsing · swap · copy · row count</text>
  <text x="90" y="510" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="21" fill="#69807a">Runs in your browser · nothing uploaded · works offline</text>
